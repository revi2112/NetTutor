[project]
name = "nettutor"
version = "0.1.0"
description = "Framework-free RAG tutor and quiz engine over networking RFCs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pyyaml>=6.0.4",
    "fastembed>=0.9.1",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the compose Postgres"]
