[project]
name = "nettutor"
version = "0.1.0"
description = "Framework-free RAG tutor and quiz engine over networking RFCs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the compose Postgres"]
